<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second brain</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&family=Shantell+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
</head>

<body>
    <div class="app-frame">
        <main class="board-container">
            <header class="board-header">
                <div class="today-pill">
                    <span class="label">Today:</span>
                    <span id="current-date" class="date-value">20.09.2026</span>
                </div>

                <h1 class="board-title">Second Brain</h1>

                <div class="clock-badge">
                    <span id="digital-clock" class="time-value">14:15</span>
                </div>
            </header>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
