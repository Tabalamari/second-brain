<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second brain</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&family=Shantell+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
</head>

<body>
    <div class="app-frame">

        <main class="board-container">

            <header class="board-header">
                <div class="today-pill">
                    <span class="label">Today:</span>
                    <span id="current-date" class="date-value">20.09.2026</span>
                </div>

                <h1 class="board-title">Second Brain</h1>

                <div class="header-right-group">
                    <button type="button" class="receipt-trigger-btn" id="open-receipt-btn" title="Print or share your tasks & meetings (Today or Upcoming Week)">
                        🖨️ Print / Share
                    </button>
                    <div class="clock-badge">
                        <button type="button" class="circadian-toggle" id="circadian-toggle" title="Atmosphere: Auto (Click to switch Morning 🌅 / Day ☀️ / Dusk 🌙)">☀️</button>
                        <span id="digital-clock" class="time-value">14:15</span>
                    </div>
                </div>
            </header>

            <div class="columns-grid">

                <section class="block-card meetings-block">
                    <div class="block-header">
                        <h2>Meeting schedule:</h2>
                        <div class="block-header-actions">
                            <button class="icon-pill-btn" id="share-meetings-btn" title="Print or share only meetings">🖨️</button>
                            <button class="add-btn" id="add-meeting-btn" title="Add a meeting">+</button>
                        </div>
                    </div>

                    <div class="section-box upper-section" id="meetings-incomplete" data-type="meeting">
                    </div>
                    <div class="section-box lower-section" id="meetings-completed" data-type="meeting">

                    </div>
                </section>

                <section class="block-card tasks-block">
                    <div class="block-header">
                        <h2>Task schedule:</h2>
                        <div class="block-header-actions">
                            <button class="icon-pill-btn" id="share-tasks-btn" title="Print or share only tasks">🖨️</button>
                            <button class="add-btn" id="add-task-btn" title="Add task">+</button>
                        </div>
                    </div>

                    <div class="section-box upper-section" id="tasks-incomplete" data-type="task">

                    </div>

                    <div class="section-box lower-section" id="tasks-completed" data-type="task">

                    </div>
                </section>

                <section class="block-card timer-block" id="timer-block">
                    <div class="block-header">
                        <h2>Timer:</h2>
                        <div class="timer-header-badges">
                            <button type="button" class="ambient-sound-btn" id="ambient-sound-btn" title="Click to cycle ambient focus sound (Rain / Brown Noise / Vinyl / Off)">🎧 Sound</button>
                            <span class="timer-active-indicator" id="timer-status-badge">Неактивно</span>
                        </div>
                    </div>

                    <div class="timer-card-inner" id="timer-card-inner">

                        <div class="active-item-header" id="active-item-title">
                            Select a task or meeting
                        </div>

                        <div class="analog-timer-wrapper">
                            <div class="focus-companion" id="focus-companion" data-state="idle" data-companion="cat" title="Click to switch companion (Cat 🐱 / Plant 🌱)">
                                <!-- Sleep Zzz bubbles -->
                                <div class="companion-zzz" aria-hidden="true">
                                    <span>z</span><span>Z</span><span>z</span>
                                </div>
                                <!-- Celebration sparkles -->
                                <div class="companion-sparkles" aria-hidden="true">
                                    <span>✦</span><span>♥</span><span>✦</span>
                                </div>

                                <!-- Doodle Cat SVG -->
                                <svg class="companion-svg companion-cat-svg" viewBox="0 0 120 72" aria-label="Focus Cat Companion">
                                    <!-- Wagging Tail -->
                                    <path class="cat-tail" d="M 92 56 Q 112 46 108 28" fill="none" stroke="#2b2d42" stroke-width="4.5" stroke-linecap="round" />
                                    <!-- Cat Head & Body perched on rim -->
                                    <path class="cat-body" d="M 32 62 C 28 38, 34 24, 36 12 L 48 24 C 55 21, 65 21, 72 24 L 84 12 C 86 24, 92 38, 88 62 Z" fill="#ffffff" stroke="#2b2d42" stroke-width="3" stroke-linejoin="round" />
                                    <!-- Pink Inner Ears -->
                                    <polygon points="39,18 37,27 45,25" fill="#ffb7c5" />
                                    <polygon points="81,18 83,27 75,25" fill="#ffb7c5" />
                                    <!-- Rosy Cheeks -->
                                    <ellipse cx="43" cy="46" rx="4.5" ry="2.5" fill="#ffb7c5" />
                                    <ellipse cx="77" cy="46" rx="4.5" ry="2.5" fill="#ffb7c5" />
                                    <!-- Sleeping Eyes (Idle) -->
                                    <g class="cat-eyes-sleep">
                                        <path d="M 44 38 Q 49 43 54 38" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round" />
                                        <path d="M 66 38 Q 71 43 76 38" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round" />
                                    </g>
                                    <!-- Awake Eyes Watching the Clock Hand (Running) -->
                                    <g class="cat-eyes-awake">
                                        <circle cx="49" cy="38" r="5.5" fill="#ffffff" stroke="#2b2d42" stroke-width="2.2" />
                                        <circle cx="71" cy="38" r="5.5" fill="#ffffff" stroke="#2b2d42" stroke-width="2.2" />
                                        <g id="cat-pupils">
                                            <circle cx="49" cy="39" r="2.7" fill="#2b2d42" />
                                            <circle cx="71" cy="39" r="2.7" fill="#2b2d42" />
                                            <circle cx="47.8" cy="37.5" r="1" fill="#ffffff" />
                                            <circle cx="69.8" cy="37.5" r="1" fill="#ffffff" />
                                        </g>
                                    </g>
                                    <!-- Happy Celebrating Eyes -->
                                    <g class="cat-eyes-happy">
                                        <path d="M 44 40 Q 49 33 54 40" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round" />
                                        <path d="M 66 40 Q 71 33 76 40" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round" />
                                    </g>
                                    <!-- Nose & Mouth (:3) -->
                                    <polygon points="58,42 62,42 60,45" fill="#e65c84" />
                                    <path d="M 55 47 Q 57.5 50 60 46 Q 62.5 50 65 47" fill="none" stroke="#2b2d42" stroke-width="2.2" stroke-linecap="round" />
                                    <!-- Whiskers -->
                                    <line x1="25" y1="41" x2="36" y2="43" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
                                    <line x1="24" y1="47" x2="36" y2="47" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
                                    <line x1="95" y1="41" x2="84" y2="43" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
                                    <line x1="96" y1="47" x2="84" y2="47" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
                                    <!-- Paws resting on the clock edge -->
                                    <ellipse class="cat-paw-left" cx="44" cy="62" rx="7" ry="5" fill="#ffffff" stroke="#2b2d42" stroke-width="2.8" />
                                    <ellipse class="cat-paw-right" cx="76" cy="62" rx="7" ry="5" fill="#ffffff" stroke="#2b2d42" stroke-width="2.8" />
                                </svg>

                                <!-- Blooming Plant SVG (Alternative Companion) -->
                                <svg class="companion-svg companion-plant-svg" viewBox="0 0 120 76" aria-label="Focus Sprout Companion">
                                    <!-- Growing Stem & Leaves group -->
                                    <g class="plant-growth" id="plant-growth-group">
                                        <!-- Stem -->
                                        <path d="M 60 54 Q 58 38 60 22" fill="none" stroke="#166534" stroke-width="3.2" stroke-linecap="round" />
                                        <!-- Left Leaf -->
                                        <path class="plant-leaf-left" d="M 59 42 C 44 40, 42 28, 58 34 Z" fill="#86efac" stroke="#2b2d42" stroke-width="2.2" stroke-linejoin="round" />
                                        <!-- Right Leaf -->
                                        <path class="plant-leaf-right" d="M 61 36 C 76 34, 78 22, 62 28 Z" fill="#4ade80" stroke="#2b2d42" stroke-width="2.2" stroke-linejoin="round" />
                                        <!-- Blooming Flower at top -->
                                        <g class="plant-flower" id="plant-flower-bloom">
                                            <circle cx="60" cy="14" r="5" fill="#ffb7c5" stroke="#2b2d42" stroke-width="2" />
                                            <circle cx="53" cy="19" r="5" fill="#ffb7c5" stroke="#2b2d42" stroke-width="2" />
                                            <circle cx="67" cy="19" r="5" fill="#ffb7c5" stroke="#2b2d42" stroke-width="2" />
                                            <circle cx="56" cy="25" r="5" fill="#ffb7c5" stroke="#2b2d42" stroke-width="2" />
                                            <circle cx="64" cy="25" r="5" fill="#ffb7c5" stroke="#2b2d42" stroke-width="2" />
                                            <circle cx="60" cy="20" r="4.2" fill="#fde047" stroke="#2b2d42" stroke-width="2" />
                                        </g>
                                    </g>
                                    <!-- Cute Pot perched on timer rim -->
                                    <polygon points="44,54 76,54 72,70 48,70" fill="#f4a261" stroke="#2b2d42" stroke-width="2.6" stroke-linejoin="round" />
                                    <rect x="41" y="49" width="38" height="6" rx="3" fill="#e76f51" stroke="#2b2d42" stroke-width="2.6" />
                                </svg>
                            </div>

                            <div class="analog-timer-container">
                                <svg class="timer-ring-svg" viewBox="0 0 200 200">
                                    <circle class="ring-bg" cx="100" cy="100" r="82" />
                                    <circle class="ring-progress" id="timer-ring-progress" cx="100" cy="100" r="82" />
                                    <line class="timer-hand" id="timer-hand" x1="100" y1="100" x2="100" y2="30" />
                                    <circle class="timer-hand-cap" cx="100" cy="100" r="5" fill="#e65c84" />
                                </svg>
                                <div class="timer-center-display">
                                    <div id="timer-time-display" class="timer-time">00:00</div>
                                    <div id="timer-label-display" class="timer-sublabel">min</div>
                                </div>
                            </div>
                        </div>

                        <div class="timer-controls">
                            <button id="timer-toggle-btn" class="timer-btn primary-btn">► Start</button>
                            <button id="timer-reset-btn" class="timer-btn secondary-btn">↺ Reset</button>
                            <button id="timer-complete-btn" class="timer-btn complete-btn">✓ Complete</button>
                        </div>

                        <div class="timer-presets">
                            <button class="preset-btn" data-minutes="5">5min</button>
                            <button class="preset-btn" data-minutes="15">15min</button>
                            <button class="preset-btn active" data-minutes="25">25min</button>
                            <button class="preset-btn" data-minutes="30">30min</button>
                            <button class="preset-btn" data-minutes="60">60min</button>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>


    <div class="modal-overlay" id="item-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Add a note</h3>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <form id="item-form">
                <input type="hidden" id="item-id">
                <input type="hidden" id="item-type" value="task">

                <div class="form-group">
                    <label for="item-text" id="item-text-label">Text / Name:</label>
                    <input type="text" id="item-text" placeholder="For example: Find a sock" required autofocus>
                </div>

                <div class="form-group" id="time-group">
                    <label for="item-time">Time / Duration (optional):</label>
                    <input type="text" id="item-time" placeholder="For example: 12:30 or 30 min">
                </div>

                <div class="form-group" id="date-group">
                    <label for="item-date">Scheduled Day (Today or Upcoming Week):</label>
                    <select id="item-date" class="form-select"></select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="modal-cancel-btn">Cancel</button>
                    <button type="submit" class="btn-submit">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Print & Share Schedule Modal (Today & Upcoming Week) -->
    <div class="modal-overlay" id="receipt-modal">
        <div class="modal-card receipt-modal-card">
            <div class="modal-header no-print">
                <h3>🖨️ Print & Share Schedule</h3>
                <button class="modal-close" id="receipt-close-btn">&times;</button>
            </div>

            <div class="planner-controls-group no-print">
                <div class="receipt-period-bar" role="tablist" aria-label="Schedule period">
                    <button type="button" class="receipt-period-btn active" data-period="today">📅 For Today</button>
                    <button type="button" class="receipt-period-btn" data-period="week">🗓️ Upcoming Week (7 Days)</button>
                </div>

                <div class="receipt-filter-bar" role="tablist" aria-label="Schedule content filter">
                    <button type="button" class="receipt-filter-btn active" data-filter="all">All Together</button>
                    <button type="button" class="receipt-filter-btn" data-filter="tasks">Only Tasks</button>
                    <button type="button" class="receipt-filter-btn" data-filter="meetings">Only Meetings</button>
                </div>
            </div>

            <!-- Printable Planner Sheet -->
            <div class="planner-sheet-wrapper" id="printable-receipt-area">
                <div class="planner-sheet" id="daily-receipt-card">
                    <div class="planner-sheet-header">
                        <div class="planner-sheet-title-row">
                            <span class="planner-sheet-brand">Second Brain — Schedule</span>
                            <span class="planner-sheet-badge" id="receipt-period-badge">Daily Plan</span>
                        </div>
                        <div class="planner-sheet-date" id="receipt-date-stamp">Date: 10.11.2026</div>
                    </div>

                    <div class="planner-sheet-body" id="receipt-items-body">
                        <!-- Dynamically populated schedule for Today or Upcoming Week -->
                    </div>

                    <div class="planner-sheet-summary" id="receipt-totals-box">
                        <!-- Dynamically populated summary -->
                    </div>
                </div>
            </div>

            <div class="receipt-actions-panel no-print">
                <div class="receipt-primary-actions">
                    <button type="button" class="timer-btn primary-btn" id="receipt-print-btn">🖨️ Print / Save PDF</button>
                    <button type="button" class="timer-btn secondary-btn" id="receipt-copy-btn">📋 Copy Text</button>
                    <button type="button" class="timer-btn complete-btn" id="receipt-native-share-btn">📤 Share...</button>
                </div>
                <div class="receipt-messenger-row">
                    <span class="share-row-label">Send to:</span>
                    <button type="button" class="messenger-pill" data-channel="telegram" title="Share via Telegram">✈️ Telegram</button>
                    <button type="button" class="messenger-pill" data-channel="whatsapp" title="Share via WhatsApp">💬 WhatsApp</button>
                    <button type="button" class="messenger-pill" data-channel="viber" title="Share via Viber">💜 Viber</button>
                    <button type="button" class="messenger-pill" data-channel="email" title="Send via Email">✉️ Email</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
